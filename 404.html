<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TasteTier</title>
    <script>
      // GitHub Pages has no server-side router, so any direct hit on
      // a path like /kphlipe-bistro 404s. This page catches that 404,
      // stashes the real path, and bounces to "/" so index.html loads.
      // App.jsx restores the path afterwards via sessionStorage.
      sessionStorage.setItem("redirectPath", location.pathname + location.search);
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
